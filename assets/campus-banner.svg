<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
<title id="title">CampusBloom campus landscape</title><desc id="desc">A calm sunny college campus with a modern academic building, trees and soft green lawns.</desc>
